<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
    <div class="box" style="width: 150px; height: 150px; background-color: rgb(235, 172, 209); display: none;"></div>
    <button class="btn1">fade in</button>
    <button class="btn2">fade out</button>
    <button class="btn3">fadein/fadeout</button>
    <script>
        jQuery(function(){
                $(".btn1").click(function(){
                    $(".box").fadeIn(5000);
                });
                $(".btn2").click(function(){
                    $(".box").fadeOut(5000);
                });
                $(".btn3").click(function(){
                    $(".box").fadeToggle(5000);
                });
        });
    </script>
</body>
</html>
